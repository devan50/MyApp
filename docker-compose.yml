
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: taskmanager
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./api
    ports: ["8000:5000"]
    environment:
      APP_PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: taskmanager
    depends_on: [db]

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  db_data:

networks:
  app-net:

