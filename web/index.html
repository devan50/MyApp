
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow | Task Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #1e293b;
}

.layout {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 240px;
    background: #172033;
    color: white;
    padding: 30px 20px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 55px;
}

.logo span {
    color: #60a5fa;
}

.nav-title {
    color: #8995aa;
    font-size: 11px;
    margin-bottom: 18px;
    letter-spacing: 2px;
}

.nav-item {
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    color: #cbd5e1;
}

.nav-item.active {
    background: #263b5d;
    color: white;
}

.main {
    flex: 1;
    padding: 35px;
    min-width: 0;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.topbar h1 {
    font-size: 27px;
}

.topbar p {
    color: #64748b;
    margin-top: 7px;
}

.user {
    background: #dbeafe;
    color: #1d4ed8;
    border-radius: 50%;
    padding: 13px;
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card, .panel {
    background: white;
    border-radius: 13px;
    padding: 23px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.04);
}

.stat-card p {
    color: #64748b;
    font-size: 14px;
}

.stat-card h2 {
    font-size: 30px;
    margin-top: 12px;
}

.content {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 22px;
}

.panel h2 {
    font-size: 19px;
    margin-bottom: 20px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.toolbar button {
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
    background: #eef2f7;
    cursor: pointer;
}

.toolbar button.active {
    background: #2563eb;
    color: white;
}

.task {
    border: 1px solid #e5eaf1;
    border-radius: 9px;
    padding: 17px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
}

.task h3 {
    font-size: 15px;
    margin-bottom: 7px;
}

.task p {
    font-size: 13px;
    color: #64748b;
}

.task-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.task-actions button {
    border: none;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.complete-btn {
    background: #dcfce7;
    color: #15803d;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.badge {
    display: inline-block;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 20px;
    margin-top: 5px;
}

.badge.pending {
    background: #fef3c7;
    color: #92400e;
}

.badge.completed {
    background: #dcfce7;
    color: #166534;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    font-weight: bold;
}

.form-group input, .form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #dbe2ea;
    border-radius: 7px;
    outline: none;
    font-family: inherit;
}

.form-group input:focus, .form-group textarea:focus {
    border-color: #2563eb;
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.add-btn {
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn:hover {
    background: #1d4ed8;
}

#message {
    margin-top: 12px;
    font-size: 13px;
    color: #64748b;
}

.empty {
    color: #64748b;
    text-align: center;
    padding: 30px;
}

@media(max-width: 900px) {
    .content {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 650px) {
    .sidebar {
        display: none;
    }

    .main {
        padding: 20px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .topbar h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">Task<span>Flow.</span></div>

        <div class="nav-title">WORKSPACE</div>
        <div class="nav-item active">▦ Dashboard</div>
        <div class="nav-item">✓ My Tasks</div>
        <div class="nav-item">◷ Activity</div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div>
                <h1>Dashboard</h1>
                <p>Manage your work and stay productive.</p>
            </div>
            <div class="user">TF</div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <p>Total Tasks</p>
                <h2 id="total">0</h2>
            </div>

            <div class="stat-card">
                <p>Pending Tasks</p>
                <h2 id="pending">0</h2>
            </div>

            <div class="stat-card">
                <p>Completed Tasks</p>
                <h2 id="completed">0</h2>
            </div>
        </section>

        <section class="content">

            <div class="panel">
                <h2>My Tasks</h2>

                <div class="toolbar">
                    <button class="active" data-filter="All">All</button>
                    <button data-filter="Pending">Pending</button>
                    <button data-filter="Completed">Completed</button>
                    <input id="search" placeholder="Search tasks..." style="padding:9px;border:1px solid #dbe2ea;border-radius:7px;min-width:140px;flex:1">
                </div>

                <div id="taskList">
                    <p class="empty">Loading tasks...</p>
                </div>
            </div>

            <div class="panel">
                <h2>Create New Task</h2>

                <form id="taskForm">
                    <div class="form-group">
                        <label>Task Title</label>
                        <input id="title" type="text"
                               placeholder="Enter task title" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description"
                                  placeholder="Describe your task..."></textarea>
                    </div>

                    <button class="add-btn" type="submit">
                        + Create Task
                    </button>
                </form>

                <p id="message"></p>
            </div>

        </section>
    </main>
</div>

<script>
const API = "/api";
let tasks = [];
let currentFilter = "All";

async function loadTasks() {
    try {
        const response = await fetch(`${API}/tasks`);

        if (!response.ok) throw new Error("Could not load tasks");

        tasks = await response.json();
        renderTasks();
        updateStats();

    } catch (error) {
        document.getElementById("taskList").innerHTML =
            '<p class="empty">Unable to connect to API. Check your backend.</p>';
        console.error(error);
    }
}

function updateStats() {
    document.getElementById("total").textContent = tasks.length;

    document.getElementById("pending").textContent =
        tasks.filter(t => t.status === "Pending").length;

    document.getElementById("completed").textContent =
        tasks.filter(t => t.status === "Completed").length;
}

function renderTasks() {
    const list = document.getElementById("taskList");
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = tasks.filter(task => {
        const matchesFilter =
            currentFilter === "All" || task.status === currentFilter;

        const matchesSearch =
            task.title.toLowerCase().includes(search);

        return matchesFilter && matchesSearch;
    });

    if (!filtered.length) {
        list.innerHTML = '<p class="empty">No tasks found. Create your first task!</p>';
        return;
    }

    list.innerHTML = filtered.map(task => {
        const isCompleted = task.status === "Completed";

        return `
        <div class="task">
            <div>
                <h3>${escapeHTML(task.title)}</h3>
                <p>${escapeHTML(task.description || "No description")}</p>
                <span class="badge ${isCompleted ? "completed" : "pending"}">
                    ${escapeHTML(task.status)}
                </span>
            </div>

            <div class="task-actions">
                <button class="complete-btn"
                    onclick="toggleTask(${task.id}, '${isCompleted ? "Pending" : "Completed"}')">
                    ${isCompleted ? "Reopen" : "Complete"}
                </button>

                <button class="delete-btn"
                    onclick="deleteTask(${task.id})">
                    Delete
                </button>
            </div>
        </div>`;
    }).join("");
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

document.getElementById("taskForm").addEventListener("submit", async event => {
    event.preventDefault();

    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;
    const message = document.getElementById("message");

    try {
        const response = await fetch(`${API}/tasks`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({title, description})
        });

        if (!response.ok) throw new Error("Task creation failed");

        event.target.reset();
        message.textContent = "Task created successfully!";
        await loadTasks();

    } catch (error) {
        message.textContent = "Unable to create task.";
        console.error(error);
    }
});

async function toggleTask(id, status) {
    try {
        const response = await fetch(`${API}/tasks/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({status})
        });

        if (!response.ok) throw new Error("Update failed");

        await loadTasks();

    } catch (error) {
        alert("Unable to update task.");
    }
}

async function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?")) return;

    try {
        const response = await fetch(`${API}/tasks/${id}`, {
            method: "DELETE"
        });

        if (!response.ok) throw new Error("Delete failed");

        await loadTasks();

    } catch (error) {
        alert("Unable to delete task.");
    }
}

document.querySelectorAll("[data-filter]").forEach(button => {
    button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll("[data-filter]").forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");
        renderTasks();
    });
});

document.getElementById("search").addEventListener("input", renderTasks);

loadTasks();
</script>

</body>
</html>
